<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ResumeVerify</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1a1a1a;
      background: #f4f6f8;
    }
    body { max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    p, .hint { color: #555; margin-bottom: 1rem; }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .row { margin-bottom: 1rem; }
    .file-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .file-row input[type="file"] { flex: 1; min-width: 200px; }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
      max-width: 100%;
    }
    .file-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .clear-btn {
      background: #fff;
      border: 1px solid #cbd5e1;
      color: #64748b;
      border-radius: 4px;
      width: 1.5rem;
      height: 1.5rem;
      line-height: 1;
      cursor: pointer;
      font-size: 1rem;
      padding: 0;
    }
    .clear-btn:hover { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
    .hidden { display: none !important; }
    button.primary {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    #status { margin-top: 1rem; font-size: 0.95rem; }
    .pass { color: #15803d; }
    .review { color: #b45309; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 0.5rem; text-align: left; }
    code { background: #f1f5f9; padding: 0.1rem 0.35rem; border-radius: 4px; }
    hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.25rem 0; }
  </style>
</head>
<body>
  <h1>ResumeVerify</h1>
  <p>Pick <strong>one</strong> upload method below. Use × to remove a file and switch options.</p>

  <div class="card">
    <div class="row">
      <label for="formsCsv">Option A — Google Forms CSV (Drive links)</label>
      <div class="file-row">
        <input id="formsCsv" type="file" accept=".csv,.xlsx,.xls" />
        <div id="formsCsvChip" class="file-chip hidden">
          <span id="formsCsvName"></span>
          <button type="button" class="clear-btn" id="formsCsvClear" title="Remove">×</button>
        </div>
      </div>
      <p class="hint"><code>Resume</code> column with Google Drive links + Name + Email.</p>
    </div>

    <hr />

    <div class="row">
      <label for="bundle">Option B — ZIP bundle</label>
      <div class="file-row">
        <input id="bundle" type="file" accept=".zip" />
        <div id="bundleChip" class="file-chip hidden">
          <span id="bundleName"></span>
          <button type="button" class="clear-btn" id="bundleClear" title="Remove">×</button>
        </div>
      </div>
      <p class="hint"><code>metadata.csv</code> + PDF files inside one ZIP.</p>
    </div>

    <hr />

    <div class="row">
      <label for="metadata">Option C — Metadata CSV / Excel (optional)</label>
      <div class="file-row">
        <input id="metadata" type="file" accept=".xlsx,.xls,.csv" />
        <div id="metadataChip" class="file-chip hidden">
          <span id="metadataName"></span>
          <button type="button" class="clear-btn" id="metadataClear" title="Remove">×</button>
        </div>
      </div>
    </div>
    <div class="row">
      <label for="pdfs">Option C — PDF resumes</label>
      <div class="file-row">
        <input id="pdfs" type="file" accept=".pdf" multiple />
        <div id="pdfsChip" class="file-chip hidden">
          <span id="pdfsName"></span>
          <button type="button" class="clear-btn" id="pdfsClear" title="Remove all">×</button>
        </div>
      </div>
      <p class="hint">Upload PDFs directly, with optional metadata sheet (Filename column).</p>
    </div>

    <div class="row">
      <label><input id="checkLinks" type="checkbox" checked /> Check live links (slower)</label>
    </div>
    <button id="submitBtn" class="primary">Run verification</button>
    <div id="status"></div>
  </div>

  <div id="results"></div>

  <script>
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const submitBtn = document.getElementById("submitBtn");

    function clearInput(inputId, chipId, nameId) {
      const old = document.getElementById(inputId);
      const clone = old.cloneNode(true);
      old.parentNode.replaceChild(clone, old);
      document.getElementById(chipId).classList.add("hidden");
      clone.addEventListener("change", () => updateSingleFile(clone, chipId, nameId));
      return clone;
    }

    function updateSingleFile(input, chipId, nameId) {
      const chip = document.getElementById(chipId);
      const nameEl = document.getElementById(nameId);
      if (input.files && input.files[0]) {
        nameEl.textContent = input.files[0].name;
        chip.classList.remove("hidden");
      } else {
        chip.classList.add("hidden");
      }
    }

    function updateMultiFile(input) {
      const chip = document.getElementById("pdfsChip");
      const nameEl = document.getElementById("pdfsName");
      if (input.files && input.files.length) {
        nameEl.textContent = input.files.length === 1
          ? input.files[0].name
          : `${input.files.length} PDFs selected`;
        chip.classList.remove("hidden");
      } else {
        chip.classList.add("hidden");
      }
    }

    function wireFilePicker(inputId, chipId, nameId, multi = false) {
      const input = document.getElementById(inputId);
      input.addEventListener("change", () => {
        if (multi) updateMultiFile(input);
        else updateSingleFile(input, chipId, nameId);
      });
      document.getElementById(chipId.replace("Chip", "Clear")).addEventListener("click", () => {
        const fresh = clearInput(inputId, chipId, nameId);
        if (multi) updateMultiFile(fresh);
      });
    }

    wireFilePicker("formsCsv", "formsCsvChip", "formsCsvName");
    wireFilePicker("bundle", "bundleChip", "bundleName");
    wireFilePicker("metadata", "metadataChip", "metadataName");
    wireFilePicker("pdfs", "pdfsChip", "pdfsName", true);

    async function pollJob(jobId) {
      const res = await fetch(`/api/jobs/${jobId}`);
      const data = await res.json();
      statusEl.textContent = `Status: ${data.status} — ${data.processed}/${data.total} (${data.phase})`;

      if (data.status === "completed") {
        submitBtn.disabled = false;
        statusEl.innerHTML += ` <a href="/api/jobs/${jobId}/report">Excel</a> · <a href="/api/jobs/${jobId}/report?format=csv">CSV (zip)</a>`;
        if (data.outcomes_summary?.length) {
          const rows = data.outcomes_summary.map(o =>
            `<tr><td>${o.filename}</td><td>${o.name || ""}</td><td class="${o.verdict === "PASS" ? "pass" : "review"}">${o.verdict}</td><td>${(o.failed_rules || []).join(", ")}</td></tr>`
          ).join("");
          resultsEl.innerHTML = `<table><thead><tr><th>File</th><th>Name</th><th>Verdict</th><th>Failed rules</th></tr></thead><tbody>${rows}</tbody></table>`;
        }
        return;
      }
      if (data.status === "failed") {
        submitBtn.disabled = false;
        statusEl.textContent = `Failed: ${data.error}`;
        return;
      }
      setTimeout(() => pollJob(jobId), 1500);
    }

    submitBtn.addEventListener("click", async () => {
      const formsCsv = document.getElementById("formsCsv").files[0];
      const bundle = document.getElementById("bundle").files[0];
      const pdfs = document.getElementById("pdfs").files;
      const meta = document.getElementById("metadata").files[0];
      const checkLinks = document.getElementById("checkLinks").checked;

      if (!formsCsv && !bundle && !pdfs.length) {
        statusEl.textContent = "Choose one option: Forms CSV, ZIP, or PDF files.";
        return;
      }

      submitBtn.disabled = true;
      resultsEl.innerHTML = "";
      statusEl.textContent = "Uploading…";

      // Priority: Forms CSV → ZIP → PDFs (clear other fields if you want a different mode)
      if (formsCsv) {
        const form = new FormData();
        form.append("form_csv", formsCsv);
        const res = await fetch(`/api/batch/forms-csv?check_links=${checkLinks}`, { method: "POST", body: form });
        if (!res.ok) {
          const err = await res.json();
          statusEl.textContent = err.detail || "Upload failed";
          submitBtn.disabled = false;
          return;
        }
        pollJob((await res.json()).job_id);
        return;
      }

      const form = new FormData();
      if (bundle) {
        form.append("bundle", bundle);
      } else {
        for (const f of pdfs) form.append("resumes", f);
        if (meta) form.append("metadata", meta);
      }

      const res = await fetch(`/api/batch?check_links=${checkLinks}`, { method: "POST", body: form });
      if (!res.ok) {
        const err = await res.json();
        statusEl.textContent = err.detail || "Upload failed";
        submitBtn.disabled = false;
        return;
      }
      pollJob((await res.json()).job_id);
    });
  </script>
</body>
</html>
